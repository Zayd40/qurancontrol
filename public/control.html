<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qur’an Tracker Pro · Controller</title>
  <link rel="stylesheet" href="/theme.css" /><link rel="stylesheet" href="/control.css" />
</head>
<body>
<main class="app">
  <header class="topbar"><div><p class="brand" id="brandText">Al Zahraa Centre</p><p class="app-label">Presentation remote</p></div><p id="lockMessage" class="connection-pill">Connecting</p></header>
  <section class="current-panel"><p id="modeLabel" class="mode-label">Quran</p><h1 id="currentRef">Waiting for the presenter</h1><p class="hint">Manual changes pause following. Use Go in admin to resume.</p></section>
  <section class="preview-panel" aria-label="Current passage preview">
    <p class="panel-label">ON THE DISPLAY</p><p id="previewTitle" class="preview-title hidden"></p><p id="previewInstruction" class="preview-instruction hidden"></p><p id="previewRepeat" class="preview-repeat hidden"></p><p id="previewReference" class="preview-reference hidden"></p><p id="previewArabic" class="preview-arabic hidden" lang="ar" dir="rtl"></p><p id="previewTransliteration" class="preview-transliteration hidden"></p><p id="previewEnglish" class="preview-english hidden"></p><p id="previewNote" class="preview-note hidden"></p>
  </section>
  <section class="scroll-grid" aria-label="Preview scrolling"><button id="scrollBackBtn" type="button">↑ Scroll preview</button><button id="scrollForwardBtn" type="button">↓ Scroll preview</button></section>
  <p id="controlNotice" class="notice" aria-live="polite"></p>
  <details class="selection-panel"><summary>Choose a passage</summary><div class="selection-body">
    <section class="mode-switch" aria-label="Mode"><button type="button" class="mode-btn" data-mode="quran">Qur’an</button><button type="button" class="mode-btn" data-mode="dua">Dua</button></section>
    <section id="quranPanel" class="control-panel"><label for="surahSelect">Surah</label><select id="surahSelect"></select><label for="ayahInput">Ayah</label><div class="row-input"><input id="ayahInput" type="number" min="1" value="1" inputmode="numeric" /><button id="ayahJumpBtn" class="secondary" type="button">Show ayah</button></div><p id="ayahHint" class="hint"></p></section>
    <section id="duaPanel" class="control-panel hidden"><label for="duaSelect">Dua</label><div class="row-input"><select id="duaSelect"></select><button id="openDuaBtn" class="secondary" type="button">Open</button></div><p id="duaNotice" class="notice" aria-live="polite"></p><label for="lineInput">Line</label><div class="row-input"><input id="lineInput" type="number" min="1" value="1" inputmode="numeric" /><button id="lineJumpBtn" class="secondary" type="button">Show line</button></div><p id="lineHint" class="hint"></p></section>
  </div></details>
  <section class="nav-grid" aria-label="Slide navigation"><button id="prevBtn" class="nav-btn" type="button">Previous ayah</button><button id="nextBtn" class="nav-btn primary" type="button">Next ayah</button></section>
</main>
<script src="/control.js"></script>
</body>
</html>
